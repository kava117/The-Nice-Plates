<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Nice Plates | Home</title>

  <!-- Google Fonts is the only external resource; the CSS falls back to system fonts if it fails. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- No defer: sets the theme before first paint to avoid a flash. -->
  <script src="theme.js"></script>
</head>
<!-- GUEST STATE. Differences from home.html are marked "STATE-SPECIFIC".
     Guests see exactly two sign-up prompts: the top-bar Sign up button and the bottom-left Sign up tile. -->
<body data-auth="guest">
  <a class="skip-link press" href="#main">Skip to content</a>

  <div class="frame">
    <header class="topbar">
      <button type="button" class="theme-toggle press" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <!-- STATE-SPECIFIC: guest shows Log in and Sign up. -->
      <!-- TODO: point Log in at the real login page (temporarily goes to home.html). -->
      <a class="btn btn-ghost press" href="home.html">Log in</a>
      <!-- TODO: point Sign up at the real sign-up page. -->
      <a class="btn btn-solid press" href="#">Sign up</a>
    </header>

    <div class="sidebar">
      <a class="brand" href="index.html">
        <!-- Stand-in quarter-note logo (open item: real logo). -->
        <svg width="16" height="20" viewBox="0 0 16 20" fill="currentColor" aria-hidden="true">
          <ellipse cx="5.5" cy="16" rx="4.5" ry="3.2" transform="rotate(-20 5.5 16)"/>
          <rect x="9" y="1" width="1.8" height="15.5"/>
        </svg>
        <span>The Nice Plates</span>
      </a>

      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a class="nav-link press" href="index.html" aria-current="page">Home</a></li>
          <!-- TODO: link to the Library page. -->
          <li><a class="nav-link press" href="#">Library</a></li>
          <!-- STATE-SPECIFIC: guests never see Progress or Settings. -->
        </ul>
      </nav>

      <!-- STATE-SPECIFIC: guest shows the Sign up tile (second and last sign-up prompt). -->
      <!-- TODO: point Sign up at the real sign-up page. -->
      <a class="account account--signup press" href="#">Sign up</a>
    </div>

    <main id="main">
      <h1 class="visually-hidden">Home</h1>

      <div class="content">
        <!-- SAMPLE DATA: the same three sample pieces as home.html. Guests get no progress bars.
             TODO: link each tile to the practice page for that piece. -->
        <ul class="tiles">
          <li>
            <a class="card press" href="#">
              <div class="card-art">
                <img src="home_imgs/sheet-fur-elise.jpg" alt="">
              </div>
              <div class="card-caption">
                <h2 class="card-title">Insert advertisement flavortext 1 here</h2>
              </div>
            </a>
          </li>
          <li>
            <a class="card press" href="#">
              <div class="card-art">
                <img src="home_imgs/sheet-moonlight-sonata.jpg" alt="">
              </div>
              <div class="card-caption">
                <h2 class="card-title">Insert advertisement flavortext 2 here</h2>
              </div>
            </a>
          </li>
          <li>
            <a class="card press" href="#">
              <div class="card-art">
                <img src="home_imgs/sheet-ode-to-joy.jpg" alt="">
              </div>
              <div class="card-caption">
                <h2 class="card-title">Insert advertisement flavortext 3 here</h2>
              </div>
            </a>
          </li>
          <li>
            <div class="actions">
              <!-- TODO: link to the Library page. -->
              <a class="btn btn-solid press" href="#">Sign up to view your full library</a>
              <!-- STATE-SPECIFIC: guest goes to sign-up, because uploading needs an account.
                   TODO: point at the real sign-up page. -->
              <a class="btn btn-ghost press" href="#">Sign up to upload new sheets</a>
            </div>
          </li>
        </ul>

        <!-- STATE-SPECIFIC: stat tiles are not rendered for guests. -->
      </div>
    </main>
  </div>

  <script src="press.js"></script>
</body>
</html>
