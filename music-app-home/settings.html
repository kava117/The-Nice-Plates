<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Nice Plates | Settings</title>

  <!-- Google Fonts is the only external resource; the CSS falls back to system fonts if it fails. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- No defer: sets the theme before first paint to avoid a flash. -->
  <script src="theme.js"></script>
</head>
<!-- SIGNED-IN STATE. Differences from index.html are marked "STATE-SPECIFIC". -->
<body data-auth="signed-in">
  <a class="skip-link press" href="#main">Skip to content</a>

  <div class="frame">
    <header class="topbar">
      <button type="button" class="theme-toggle press" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <!-- STATE-SPECIFIC: signed in shows Log out only. -->
      <!-- TODO: Log out should end the session (a button or form action, not a plain link). Temporarily goes to index.html. -->
      <a class="btn btn-ghost press" href="index.html">Log out</a>
    </header>

    <div class="sidebar">
      <a class="brand" href="home.html">
        <!-- Stand-in quarter-note logo (open item: real logo). -->
        <svg width="16" height="20" viewBox="0 0 16 20" fill="currentColor" aria-hidden="true">
          <ellipse cx="5.5" cy="16" rx="4.5" ry="3.2" transform="rotate(-20 5.5 16)"/>
          <rect x="9" y="1" width="1.8" height="15.5"/>
        </svg>
        <span>The Nice Plates</span>
      </a>

      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a class="nav-link press" href="home.html">Home</a></li>
          <!-- TODO: link to the Library page. -->
          <li><a class="nav-link press" href="library.html">Library</a></li>
          <!-- STATE-SPECIFIC: Progress and Settings are for signed-in users only. -->
          <li><a class="nav-link press" href="progress.html">Progress</a></li>
          <li><a class="nav-link press" href="settings.html" aria-current="page">Settings</a></li>
        </ul>
      </nav>

      <!-- STATE-SPECIFIC: signed in shows the account tile. -->
      <!-- TODO: link to the Account page; a later step fills the name and initials from the account. -->
      <a class="account press" href="#" aria-label="Account: Sample User">
        <span class="avatar" aria-hidden="true"><span data-user-initials>SU</span></span>
        <span class="account-text">
          <span class="account-name" data-user-name>Sample User</span>
          <span class="account-role">Account</span>
        </span>
      </a>
    </div>

    <main id="main">
      <h1 class="visually-hidden">Settings</h1>

      <!-- TODO: none of these controls are wired up yet; Save and the
           account buttons do nothing. Values below are SAMPLE DATA. -->
      <div class="content">
        <form class="settings" action="#" onsubmit="return false">
          <section class="panel" aria-labelledby="settings-account">
            <h2 class="section-title" id="settings-account">Account</h2>
            <div class="field">
              <label for="display-name">Display name</label>
              <input class="input" id="display-name" type="text" value="Sample User" autocomplete="name">
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input class="input" id="email" type="email" value="sample.user@example.com" autocomplete="email">
            </div>
            <div class="field-actions">
              <button type="button" class="btn btn-ghost press">Change password</button>
            </div>
          </section>

          <section class="panel" aria-labelledby="settings-practice">
            <h2 class="section-title" id="settings-practice">Practice</h2>
            <div class="field">
              <label for="daily-goal">Daily practice goal</label>
              <select class="input" id="daily-goal">
                <option>15 minutes</option>
                <option selected>30 minutes</option>
                <option>45 minutes</option>
                <option>1 hour</option>
              </select>
            </div>
            <label class="switch-row">
              <span>
                <span class="switch-title">Practice reminders</span>
                <span class="switch-hint">A daily nudge if you haven't practiced yet.</span>
              </span>
              <input class="switch" type="checkbox" checked>
            </label>
            <label class="switch-row">
              <span>
                <span class="switch-title">Show progress on piece tiles</span>
                <span class="switch-hint">The progress badge on your home and library tiles.</span>
              </span>
              <input class="switch" type="checkbox" checked>
            </label>
          </section>

          <section class="panel" aria-labelledby="settings-danger">
            <h2 class="section-title" id="settings-danger">Account actions</h2>
            <div class="field-actions">
              <button type="button" class="btn btn-ghost press">Log out of all devices</button>
              <button type="button" class="btn btn-danger press">Delete account</button>
            </div>
          </section>

          <div class="settings-save">
            <button type="submit" class="btn btn-solid press">Save changes</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="press.js"></script>
</body>
</html>
