{# Guest home page. Displays welcome sign for unsigned-in users. #}
{% set title = "Index" %}
{% set active = "index" %}
{% set auth = "guest" %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to The Nice Plates!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-auth="guest">

  <a class="skip-link press" href="#main">Skip to content</a>

  <main id="main">
      <div class="content">
        <section class="welcome">
          <h1 class="welcome-title">Welcome to The Nice Plates!</h1>
          <p class="welcome-text">
            Blah blah lbha welcome blah.
          </p>

          <a class="btn btn-ghost btn-google press" href="{{ url_for('login') }}">
            <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />

              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            Sign in with Google
          </a>
        </section>
      </div>
    </main>

  </div>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/press.js') }}"></script>
</body>
</html>
