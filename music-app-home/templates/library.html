{# Signed-in home page. #}
{% set title = "Home" %}
{% set active = "home" %}
{% set auth = "signed-in" %}
{% include "header.html" %}
<!DOCTYPE html>

<div class="content">

  <div class="library-header">
    <h2 class="section-title">Your most recent:</h2>
    <div class="view-toggle" role="group" aria-label="Grid density">
      <button type="button" class="view-option" data-density="compact">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <circle cx="3" cy="3" r="1.3" /><circle cx="8" cy="3" r="1.3" /><circle cx="13" cy="3" r="1.3" />
          <circle cx="3" cy="8" r="1.3" /><circle cx="8" cy="8" r="1.3" /><circle cx="13" cy="8" r="1.3" />
        </svg>
        Compact
      </button>
      <button type="button" class="view-option is-active" aria-pressed="true" data-density="normal">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <rect x="1" y="1" width="6" height="6" rx="1" /><rect x="9" y="1" width="6" height="6" rx="1" />
          <rect x="1" y="9" width="6" height="6" rx="1" /><rect x="9" y="9" width="6" height="6" rx="1" />
        </svg>
        Normal
      </button>
      <button type="button" class="view-option" data-density="cozy">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <rect x="1" y="1" width="14" height="14" rx="2" />
        </svg>
        Cozy
      </button>
    </div>
  </div>

  <form class="field" action="/api/pieces" method="post" enctype="multipart/form-data">
    <label for="sheet">Add a piece: a PDF, a photo, or a MusicXML file</label>
    <input class="input" id="sheet" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.musicxml,.xml,.mxl" required>
    <input class="input" name="title" type="text" placeholder="Title (optional)">
    <input class="input" name="composer" type="text" placeholder="Composer (optional)">
    <button type="submit" class="btn btn-solid press">Upload</button>
  </form>

  <ul class="library-grid">
    {% for piece in pieces %}
    <li><a class="card" href="/practice?piece={{ piece.id }}">
      <div class="card-art"></div>
      <div class="card-caption">
        <div class="card-title">{{ piece.title }}</div>
        <div class="card-subtitle">{{ piece.composer or "" }}</div>
      </div>
    </a></li>
    {% endfor %}
  </ul>

</div>

{% include "footer.html" %}
