{# Practice page: renders one piece from the library, or the demo score. #}
{% set title = "Practice" %}
{% set active = "practice" %}
{% set auth = "signed-in" %}
{% include "header.html" %}


<div id="controls">
  <button id="cursor-prev">&#9664; Prev</button>
  <button id="cursor-next">Next &#9654;</button>
  <button id="cursor-reset">Reset</button>
  <button id="zoom-in">+</button>
  <button id="zoom-out">-</button>
  <button id="timer">Start practice</button> <span id="clock"></span>
  <button id="record">Record</button> <span id="take"></span>
</div>

<div id="score"></div>

<script src="/opensheetmusicdisplay.min.js"></script>
<script>
  const piece = new URLSearchParams(location.search).get("piece");  // from the library; no piece = the demo score
  const SONG_URL = piece ? `/api/pieces/${piece}/musicxml` : "/AirOnG.musicxml";

  const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("score", {
    autoResize: true,
    drawTitle: true,
    followCursor: true,   // scrolls the page to keep the cursor in view
  });

  async function loadSong(url) {
    try {
      await osmd.load(url);
      osmd.render();
      osmd.cursor.show();   // cursor only exists after render()
    } catch (err) {
      console.error("Couldn't load song:", err);
      if (url !== "/AirOnG.musicxml") loadSong("/AirOnG.musicxml");   // the server is down or the piece is gone: still show a score
    }
  }

  // ---- Cursor controls ----
  function cursorNext() {
    if (!osmd.cursor.Iterator.EndReached) osmd.cursor.next();
  }
  function cursorPrev() {
    osmd.cursor.previous();
  }
  function cursorReset() {
    osmd.cursor.reset();
  }

  document.getElementById("cursor-next").addEventListener("click", cursorNext);
  document.getElementById("cursor-prev").addEventListener("click", cursorPrev);
  document.getElementById("cursor-reset").addEventListener("click", cursorReset);

  document.getElementById("zoom-in").addEventListener("click", () => {
    osmd.zoom = Math.min(osmd.zoom + 0.1, 3);
    osmd.render();
  });
  document.getElementById("zoom-out").addEventListener("click", () => {
    osmd.zoom = Math.max(osmd.zoom - 0.1, 0.4);
    osmd.render();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") cursorNext();
    if (e.key === "ArrowLeft") cursorPrev();
  });

  loadSong(SONG_URL);

  // ---- Practice timer: saves a row in Sessions on stop ----
  const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).then(r => r.json());
  if (piece) post("/api/practice/piece", { piece_id: +piece });   // the saved session remembers which piece it was
  const timer = document.getElementById("timer"), clock = document.getElementById("clock");
  let running = false, tick;
  timer.addEventListener("click", async () => {
    const state = await post(running ? "/api/timer/stop" : "/api/timer/start");
    running = state.running;
    clearInterval(tick);
    timer.textContent = running ? "Stop and save" : "Start practice";
    if (running) tick = setInterval(() => { state.elapsed++; clock.textContent = `${Math.floor(state.elapsed / 60)}:${String(state.elapsed % 60).padStart(2, "0")}`; }, 1000);
    else clock.textContent = state.saved_session_id ? `Saved ${state.time_spent < 60 ? state.time_spent + " s" : Math.round(state.time_spent / 60) + " min"}` : "";
  });

  // ---- Record a take: saves the audio in Recordings ----
  const record = document.getElementById("record"), take = document.getElementById("take");
  let recorder;
  record.addEventListener("click", async () => {
    if (!piece) { take.textContent = "Open a piece from the library to record it"; return; }
    if (recorder) { recorder.stop(); return; }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      recorder = null;
      record.textContent = "Record";
      const form = new FormData();
      form.append("file", new Blob(chunks, { type: "audio/webm" }), "take.webm");
      const saved = await fetch(`/api/pieces/${piece}/recordings`, { method: "POST", body: form }).then(r => r.json());
      take.innerHTML = `Take ${saved.id} saved <audio controls src="/api/recordings/${saved.id}"></audio>`;
    };
    recorder.start();
    record.textContent = "Stop recording";
  });
</script>

{% include "footer.html" %}
