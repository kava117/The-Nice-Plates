# Render: New > Blueprint > this repo. One free web service. Blueprint generates SECRET_KEY;
# a service made by hand needs SECRET_KEY set in the dashboard, or the app refuses to start.
# SQLite lives on the instance disk, so it resets on each deploy.
services:
  - type: web
    name: the-nice-plates
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r ml/requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT   # one worker: a second would double homr's memory
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY   # signs login cookies; made once and kept across deploys
        generateValue: true
      - key: PHOTO_UPLOADS   # homr needs ~1 GB of RAM; the free plan has 512 MB. Remove this on a bigger plan.
        value: "off"
